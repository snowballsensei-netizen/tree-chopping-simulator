<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tree Chopping Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/friends.css">
<link rel="stylesheet" href="css/patchnotes.css">
<link rel="stylesheet" href="css/leaderboard.css">
<link rel="stylesheet" href="css/daily.css">
<link rel="stylesheet" href="css/quests.css">
<script>
// cache-busting: game files get ?v=<hour>, so every device picks up a new release within the hour
window.TCS_V = Math.floor(Date.now() / 3600000);
document.querySelectorAll('link[rel=stylesheet][href^="css/"]').forEach(l => { l.href = l.getAttribute('href') + '?v=' + window.TCS_V; });
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="ui-layer"></div>
</div>
<script>document.write('<script src="js/firebase-config.js?v=' + window.TCS_V + '"><\/script>');</script>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
const files = ['util','data','state','scene','world','upgrades3d','audio','fx','ui','accounts','cloud','duel3d','friends','daily','quests','menu','leaderboard','matchmaking','main','patchnotes'];
function load(i){
  if (i >= files.length) return;
  const s = document.createElement('script');
  s.src = 'js/' + files[i] + '.js?v=' + window.TCS_V;
  s.onload = () => load(i + 1);
  s.onerror = () => { console.error('Failed to load js/' + files[i] + '.js'); load(i + 1); };
  document.body.appendChild(s);
}
// Cloud mode: load the Firebase SDK only when js/firebase-config.js holds a config (or ?emu for the emulator tests).
// If it can't load (offline), TCS.fb stays null and js/cloud.js plays from the local cache.
async function boot(){
  const T = window.TCS = window.TCS || {};
  const emu = /[?&]emu\b/.test(location.search);
  if (/[?&]local\b/.test(location.search)) T.FIREBASE_CONFIG = null;   // ?local: force local accounts (tests)
  if (emu) T.FIREBASE_CONFIG = { apiKey: 'demo-key', authDomain: 'demo-tcs.firebaseapp.com', projectId: 'demo-tcs', appId: 'demo' };
  if (T.FIREBASE_CONFIG){
    try {
      const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [app, A, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
      T.fb = { app: app.initializeApp(T.FIREBASE_CONFIG), A, F, emu };
    } catch(e){ console.warn('Firebase SDK unavailable, playing offline', e); T.fb = null; }
  }
  load(0);
}
boot();
</script>
</body>
</html>
